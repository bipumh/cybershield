# CyberShield — development/production bundle (services separated per #43)
# Swap DATABASE_URL to point at the postgres service for full production parity.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybershield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybershield_dev_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-cybershield}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybershield}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &backend_env
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please-64-bytes-random}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cybershield}:${POSTGRES_PASSWORD:-cybershield_dev_pass_change_me}@db:5432/${POSTGRES_DB:-cybershield}
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
      AI_PROVIDER: ${AI_PROVIDER:-off}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cybershieldplatform.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeThis!Now12345}
      SCAN_ALLOW_INSECURE: ${SCAN_ALLOW_INSECURE:-false}
    ports: ["8000:8000"]
    volumes:
      - reports:/app/reports_output
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports: ["8080:80"]

volumes:
  pgdata:
  redisdata:
  reports:
