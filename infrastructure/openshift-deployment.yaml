# OpenShift / Kubernetes deployment template (hosting-agnostic).
# `oc apply -f` or `kubectl apply -f`. Adjust namespace, image, secrets as needed.
apiVersion: v1
kind: Template
metadata:
  name: cybershield
  annotations:
    description: "CyberShield Vulnerability Assessment & Exposure Management Platform"
objects:
  - apiVersion: v1
    kind: Secret
    metadata: {name: cybershield-secrets}
    type: Opaque
    stringData:
      secret-key: ${SECRET_KEY}
      postgres-password: ${POSTGRES_PASSWORD}
      ai-api-key: ${AI_API_KEY}
  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cybershield-backend}
    spec:
      replicas: 2
      selector: {matchLabels: {app: cybershield-backend}}
      template:
        metadata: {labels: {app: cybershield-backend}}
        spec:
          containers:
            - name: backend
              image: ${BACKEND_IMAGE}
              ports: [{containerPort: 8000}]
              envFrom:
                - configMapRef: {name: cybershield-config}
              env:
                - {name: SECRET_KEY, valueFrom: {secretKeyRef: {name: cybershield-secrets, key: secret-key}}}
                - {name: AI_API_KEY, valueFrom: {secretKeyRef: {name: cybershield-secrets, key: ai-api-key}}}
              livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 30}
              readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
  - apiVersion: v1
    kind: ConfigMap
    metadata: {name: cybershield-config}
    data:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL: ${AI_MODEL}
  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cybershield-frontend}
    spec:
      replicas: 1
      selector: {matchLabels: {app: cybershield-frontend}}
      template:
        metadata: {labels: {app: cybershield-frontend}}
        spec:
          containers:
            - name: frontend
              image: ${FRONTEND_IMAGE}
              ports: [{containerPort: 80}]
  - apiVersion: v1
    kind: Service
    metadata: {name: cybershield-backend}
    spec:
      selector: {app: cybershield-backend}
      ports: [{port: 8000, targetPort: 8000}]
  - apiVersion: v1
    kind: Service
    metadata: {name: cybershield-frontend}
    spec:
      selector: {app: cybershield-frontend}
      ports: [{port: 80, targetPort: 80}]
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata: {name: cybershield}
    spec:
      to: {kind: Service, name: cybershield-frontend, weight: 100}
      tls: {termination: edge}
parameters:
  - name: SECRET_KEY
    value: change-me
  - name: POSTGRES_PASSWORD
    value: change-me
  - name: POSTGRES_USER
    value: cybershield
  - name: POSTGRES_DB
    value: cybershield
  - name: POSTGRES_HOST
    value: db
  - name: AI_API_KEY
    value: ""
  - name: AI_PROVIDER
    value: off
  - name: AI_MODEL
    value: ""
  - name: ENVIRONMENT
    value: production
  - name: CORS_ORIGINS
    value: https://cybershield.example.com
  - name: BACKEND_IMAGE
    value: quay.io/your-org/cybershield-backend:latest
  - name: FRONTEND_IMAGE
    value: quay.io/your-org/cybershield-frontend:latest
